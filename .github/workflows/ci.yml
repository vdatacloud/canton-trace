name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  release-script:
    name: Release script tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Test scripts/next-version.sh
        run: bash scripts/test-next-version.sh

  lint:
    name: Go Lint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          args: ./...

  unit-tests:
    name: Go Unit Tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Build
        run: go build ./...

      - name: Run unit tests
        run: go test -v ./...
